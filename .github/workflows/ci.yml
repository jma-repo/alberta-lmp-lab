name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests (SCED vs AESO examples, conformal calibration, hub clustering, PDUP rules, agent guardrails, dashboard build)
        env:
          LMPLAB_NO_LLM: "1"
          LMPLAB_NO_MLFLOW: "1"
        run: uv run pytest
