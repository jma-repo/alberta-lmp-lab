[project]
name = "lmplab"
version = "0.1.0"
description = "AI for locational marginal pricing in Alberta's restructured energy market: analytics, forecasting, SCED and model validation on AESO public data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "James Ma" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.1",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
lmplab = "lmplab.cli:main"

[dependency-groups]
analysis = [
    "mlflow>=2.16",
    "plotly>=5.24",
    "jinja2>=3.1",
    "pandapower>=2.14",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["analysis", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmplab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:.*starlette.testclient.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
